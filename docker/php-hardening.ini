; slims-hardened: loaded after php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_include = Off

; No shell access from PHP. SLiMS 9.8 only uses exec() to tar the backup and
; checks function_exists() first, so backups still work (uncompressed .sql).
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,dl,show_source

; PHP can only touch the app and temp space.
open_basedir = /var/www/html:/tmp:/usr/local/lib/php

memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 40M

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
