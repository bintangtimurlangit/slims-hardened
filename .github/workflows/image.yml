name: image

# Builds ghcr.io/<owner>/slims-hardened. Runs on every push to the hardened branch,
# on version tags, and monthly so the PHP/Apache base image picks up security patches.
on:
  push:
    branches: [hardened]
    tags: ["v*-h*"]
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardened

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read SLiMS version
        id: v
        run: echo "slims=$(grep -oP "SENAYAN_VERSION_TAG', 'v\K[0-9.]+" sysconfig.inc.php)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/slims-hardened:${{ steps.v.outputs.slims }}
            ghcr.io/${{ github.repository_owner }}/slims-hardened:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=SLiMS ${{ steps.v.outputs.slims }}, hardened
